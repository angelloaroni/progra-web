<html>
  <body>
    <div id="app"></div>

    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const app = document.getElementById('app');

      const otrosHeroes = ["Flash", "Linterna Verde", "Bluebeetle", "Nightwing"]

      const OtroHeroe = (props) => {
        return <li>{ props.nombre } </li>
      }
      //forma antigua, que tambien funciona
      function Header() {
        return (
            <header>
              <h1>Mis Superhéroes favoritos</h1>
            </header>
        )
      }
      //forma moderna de decalrar funciones
      //props son como los atributos que recibe la funcion o algo asi, eneste caso se 
      //recibe titulo y parrafo, que se utilizan para mostrar el titulo y el parrafo del articulo
      const Article = (props) => {
        return (
          <article>
                <h2>{ props.titulo }</h2>
                <p>{ props.parrafo } </p>
          </article>
        )
      }
      // el "<>" se llama fragment y se utiliza para envolver varios elementos sin necesidad de crear un div o un section, es decir, no se renderiza en el DOM
      function Pagina() {

        //useState
        //useStave devuelve variable de etado, es una variable que cuando se actualiza la variable, se 
        //actualiza el componenete al que pertenece, se declara la variable y una fncn para actualizxarel
        const [contador, setContador] = React.useState(0);
        const [max, setMax] = React.useState(10);
        //si no es un numero puede ser bacvio, o un nombre, o lo que sea, o un objeto vacio etc
        const [nombre, setNombre] = React.useState(
          {
            Nombre: "",
            Apellido: "",
          }
      )
        
        const handleClick = () =>{
          if (contador >= max) {
            alert("Has alcanzado el máximo de clicks")
            setContador(contador)
            return
          }
          setContador(contador+1)
          console.log(contador)
          
        }
        return (
          <>
            <Header />
            <main>
              <p>Bienvenido!</p>
              <Article titulo="Superman" parrafo="Superman viene de Krypton. "/>
              <Article titulo="Batman" parrafo="Batman no tiene superpoderes, solo tiene plata."/>
              <Article titulo="Aquaman" parrafo="El superpoder de aquaman es hablar con peces. "/>
              <h2>Otros héroes conocidos:</h2>
              <ul>
                {
                  otrosHeroes.map((n) => <OtroHeroe nombre={n} key={n} /> )
                }  
              </ul>
              <br/>
              
              <button onClick={() => handleClick()}>CLICK ME</button>
              <p>Contador: {contador}</p>
            </main>
          </>
        )
      }

      ReactDOM.render(<Pagina />, app);
    </script>
  </body>
</html>
